# Position of joints [ie. wheels] (published by ignition::gazebo::systems::JointStatePublisher)
- ros_topic_name: 'joint_states'
  gz_topic_name: '/model/husky1/joint_states'
  ros_type_name: 'sensor_msgs/msg/JointState'
  gz_type_name: 'ignition.msgs.Model'
  direction: GZ_TO_ROS

# Odometry (published by ignition::gazebo::systems::OdometryPublisher)
- ros_topic_name: 'odometry'
  gz_topic_name: '/model/husky1/odometry'
  ros_type_name: 'nav_msgs/msg/Odometry'
  gz_type_name: 'ignition.msgs.Odometry'
  direction: GZ_TO_ROS

# Intertial Measurement Unit
- ros_topic_name: 'imu'
  gz_topic_name: '/model/husky1/imu'
  ros_type_name: 'sensor_msgs/msg/Imu'
  gz_type_name: 'ignition.msgs.IMU'
  direction: GZ_TO_ROS

# Base contact (ignition Contact system + bumper_contact sensor)
- ros_topic_name: 'bumper_contact'
  gz_topic_name: '/model/husky1/bumper_contact'
  ros_type_name: 'ros_gz_interfaces/msg/Contacts'
  gz_type_name: 'ignition.msgs.Contacts'
  direction: GZ_TO_ROS

# Wheel contacts. The front wheels hit a rock before the base box does.
- ros_topic_name: 'front_left_contact'
  gz_topic_name: '/model/husky1/front_left_contact'
  ros_type_name: 'ros_gz_interfaces/msg/Contacts'
  gz_type_name: 'ignition.msgs.Contacts'
  direction: GZ_TO_ROS
- ros_topic_name: 'front_right_contact'
  gz_topic_name: '/model/husky1/front_right_contact'
  ros_type_name: 'ros_gz_interfaces/msg/Contacts'
  gz_type_name: 'ignition.msgs.Contacts'
  direction: GZ_TO_ROS
- ros_topic_name: 'rear_left_contact'
  gz_topic_name: '/model/husky1/rear_left_contact'
  ros_type_name: 'ros_gz_interfaces/msg/Contacts'
  gz_type_name: 'ignition.msgs.Contacts'
  direction: GZ_TO_ROS
- ros_topic_name: 'rear_right_contact'
  gz_topic_name: '/model/husky1/rear_right_contact'
  ros_type_name: 'ros_gz_interfaces/msg/Contacts'
  gz_type_name: 'ignition.msgs.Contacts'
  direction: GZ_TO_ROS

# Command velocity
- ros_topic_name: 'cmd_vel'
  gz_topic_name: '/model/husky1/cmd_vel'
  ros_type_name: 'geometry_msgs/msg/Twist'
  gz_type_name: 'ignition.msgs.Twist'
  direction: ROS_TO_GZ

# Lidar: laserscan
- ros_topic_name: "scan"
  gz_topic_name: "/model/husky1/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Camera: RGB
- ros_topic_name: "camera/image"
  gz_topic_name: "/model/husky1/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

# Camera: calibration (perception teammate; not ice ground truth)
- ros_topic_name: "camera/camera_info"
  gz_topic_name: "/model/husky1/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Camera: depth
- ros_topic_name: "camera/depth/image"
  gz_topic_name: "/model/husky1/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

# Camera: depth pointcloud
- ros_topic_name: "camera/depth/points"
  gz_topic_name: "/model/husky1/camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Downward sonar (gpu_lidar substitute, PFMS-style terrain)
- ros_topic_name: "sonar"
  gz_topic_name: "/model/husky1/sonar"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
