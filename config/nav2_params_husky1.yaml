bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      # Was 40 s: Husky ground into rocks for a long time before backup.
      movement_time_allowance: 12.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.8
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.0
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.35
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 7
      vy_samples: 1
      vtheta_samples: 7
      sim_time: 2.0
      linear_granularity: 0.2
      angular_granularity: 0.2
      transform_tolerance: 2.0
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.8
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      # BaseObstacle must beat PathAlign/PathDist or DWB hugs the polyline
      # into a rock until "Failed to make progress". Issue 51/52 demo fix.
      BaseObstacle.scale: 48.0
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 8.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 12.0
      RotateToGoal.xy_goal_tolerance: 1.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: husky1_odom
      robot_base_frame: husky1_base_link
      use_sim_time: true
      transform_tolerance: 1.0
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: '[ [0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5] ]'
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.8
        inflation_radius: 1.60
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan_filtered bumper_scan
        scan_filtered:
          topic: scan_filtered
          # Heights are measured in the costmap frame, i.e. WORLD z. The EKF is 3D now,
          # so on the ramp the lidar sits at z = ramp height + 0.85 m (about 5 m at the
          # summit) and the old 2.0 m cap dropped every hit there. Ground and ramp hits
          # are already removed by scan_ground_filter, so only widen the window.
          min_obstacle_height: -2.0
          max_obstacle_height: 50.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
        bumper_scan:
          topic: bumper_scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: -2.0
          max_obstacle_height: 50.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.2
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      # Must stay true: RViz Map display needs full OccupancyGrid (source husky1
      # / nav2_params.yaml / parrot). false → "No map received" / 0x0 in RViz.
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: husky1_map
      robot_base_frame: husky1_base_link
      use_sim_time: true
      transform_tolerance: 1.0
      footprint: '[ [0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5] ]'
      resolution: 0.1
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan_filtered bumper_scan
        scan_filtered:
          topic: scan_filtered
          # Heights are measured in the costmap frame, i.e. WORLD z. The EKF is 3D now,
          # so on the ramp the lidar sits at z = ramp height + 0.85 m (about 5 m at the
          # summit) and the old 2.0 m cap dropped every hit there. Ground and ramp hits
          # are already removed by scan_ground_filter, so only widen the window.
          min_obstacle_height: -2.0
          max_obstacle_height: 50.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 40.0
          raytrace_min_range: 0.0
          obstacle_max_range: 25.0
          obstacle_min_range: 0.0
        bumper_scan:
          topic: bumper_scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: -2.0
          max_obstacle_height: 50.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.2
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 1.50
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      # Issue 17. A wider search makes NavFn report a legal potential and
      # then fail to trace the path. Blocked steps are routed around in
      # husky_detour.py, so this stays at 2 m.
      tolerance: 1.5 # old vals:2.0
      use_astar: true
      allow_unknown: true
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: husky1_odom
    robot_base_frame: husky1_base_link
    transform_tolerance: 1.0
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 1.0
    - 0.0
    - 1.5
    min_velocity:
    - -1.0
    - 0.0
    - -1.5
    max_accel:
    - 2.5
    - 0.0
    - 3.2
    max_decel:
    - -2.5
    - 0.0
    - -3.2
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
