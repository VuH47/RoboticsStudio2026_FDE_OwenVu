bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: husky1_map
    robot_base_frame: husky1_base_link
    odom_topic: odom
    bt_loop_duration: 50
    default_server_timeout: 2000
    wait_for_service_timeout: 5000
    # Default Nav2 tree clears the whole costmap when a plan fails, which
    # deletes the rock and the robot then drives into it. This tree replans
    # with the rock still on the map and only backs up.
    default_nav_to_pose_bt_xml: "$(find-pkg-share 41068_ignition_bringup)/config/husky_navigate_to_pose.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
