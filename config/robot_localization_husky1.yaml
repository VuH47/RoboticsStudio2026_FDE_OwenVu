/**:
  ros__parameters:
    frequency: 30.0
    # 3D so the filter keeps real z, roll and pitch on the snow ramp. With
    # two_d_mode: true the EKF forced z=0 and roll=pitch=0, so every consumer
    # of /husky1/odom (scan_ground_filter pitch compensation, TF, costmaps)
    # believed the Husky was flat while it was ~4 m up (Issue 44 / 45).
    two_d_mode: false
    publish_acceleration: false
    publish_tf: true
    map_frame: map
    odom_frame: husky1_odom
    base_link_frame: husky1_base_link
    world_frame: husky1_odom
    odom0: odometry
    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    # Wheel/Gazebo odometry gives body-frame velocities only. vz is fused
    # (it is ~0 for a ground vehicle): with the IMU pitch below, z is then
    # integrated as vx*sin(pitch) instead of staying at zero.
    odom0_config:
    - false
    - false
    - false
    - false
    - false
    - false
    - true
    - true
    - true
    - false
    - false
    - true
    - false
    - false
    - false
    imu0: imu
    # IMU supplies absolute roll and pitch (gravity reference) plus the three
    # angular rates. Yaw is NOT fused as an absolute angle: the IMU yaw
    # reference is not tied to the robot's odom frame.
    imu0_config:
    - false
    - false
    - false
    - true
    - true
    - false
    - false
    - false
    - false
    - true
    - true
    - true
    - false
    - false
    - false
    imu0_remove_gravitational_acceleration: false
